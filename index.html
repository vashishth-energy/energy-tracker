const m=cm(),R=S.rates;$("t3").innerHTML=`<div class="card" style="border-color:var(--ac)"><div class="row sb"><div><div class="h2" style="color:var(--ac)">🔓 Admin Mode Active</div><div class="mu">Log out to go back to View-Only.</div></div><button class="chip" onclick="setAdm(false)">🔒 Log out</button></div><button class="go s" onclick="doReset(true)">📧 Email me a password reset link</button></div><div class="card"><div class="h2">Export Data</div><div class="mu">Download current meter readings.</div><div class="g2"><button class="go" style="margin:0" onclick="exp('xlsx')">📊 Excel (.xlsx)</button><button class="go s" style="margin:0" onclick="exp('csv')">📄 CSV</button></div></div><div class="card"><div class="h2">Billing Period</div><div class="g2"><div><label>Start Date</label><input type="date" id="bs" value="${m.start}"></div><div><label>End Date</label><input type="date" id="be" value="${m.end}"></div></div><button class="go" onclick="saveBill()">Save Billing Dates</button><button class="go s" onclick="nextBill()">Start Next Billing Period (2 Months)</button></div><div class="card"><div class="h2">Electricity Tariff Rates (₹)</div><div class="mu">Used to calculate estimated bill &amp; solar savings.</div><div class="g3"><div><label>Import (₹/u)</label><input type="number" step="any" id="ri" value="${R.imp}"></div><div><label>Export (₹/u)</label><input type="number" step="any" id="re" value="${R.exp}"></div><div><label>Fixed (₹)</label><input type="number" step="any" id="rf" value="${R.fix}"></div></div><button class="go" onclick="saveRates()">Save Tariff Rates</button></div><div class="card"><div class="h2">Daily Reminder Time</div><div class="mu">The reminder banner shows on the dashboard after this time if the day's reading is not added. This time is for the selected meter only. Switch the meter at the top to set another. Tap Off to turn it off.</div>${[cm()].map(m=>`<label>${esc(m.name)}</label><div class="row"><input type="time" class="rtm" data-m="${m.id}" value="${m.rt===undefined?"19:30":m.rt}"><button class="chip" onclick="this.previousElementSibling.value=''">Off</button></div>`).join("")}<button class="go" onclick="saveRem()">Save Reminder Times</button></div><div class="card"><div class="h2">Solar System Details</div><div class="mu">Details of the solar plant for the selected meter.</div><div class="g2"><div><label>Installed capacity</label><input type="number" step="any" id="sc" placeholder="e.g. 5" value="${m.cap??""}"></div><div><label>Unit</label><select id="su"><option${m.capu!=="MW"?" selected":""}>kW</option><option${m.capu==="MW"?" selected":""}>MW</option></select></div><div><label>Solar panel company</label><input id="sp" placeholder="e.g. Waaree" value="${esc(m.pb||"")}"></div><div><label>Panel wattage (W)</label><input type="number" step="any" id="sw" placeholder="e.g. 545" value="${m.pw??""}"></div><div><label>Number of panels</label><input type="number" id="sn" value="${m.pn??""}"></div><div><label>Installation date</label><input type="date" id="sd" value="${m.pd||""}"></div></div><label>Installer / vendor (optional)</label><input id="si" value="${esc(m.pi||"")}"><div class="h2" style="margin-top:16px">Inverters</div><div class="mu">Add one row for each inverter you have, with its brand or name.</div>${invs(m).map(x=>`<div class="row" style="margin-top:8px"><input class="ivn" data-i="${x.id}" placeholder="Inverter brand / name" value="${esc(x.name)}"><button class="chip" onclick="delInv('${x.id}')">${CF==="i"+x.id?"Sure?":"✕"}</button></div>`).join("")}<button class="go s" onclick="addInv()">+ Add inverter</button><button class="go" onclick="saveSys()">Save Solar Details</button></div><div class="card"><div class="h2">Manage Meters</div><div class="g2"><div><label>Meter Name</label><input id="mn" value="${esc(m.name)}"></div><div><label>Consumer No.</label><input id="mc" value="${esc(m.consumer)}"></div></div><div class="g2"><button class="go" style="margin:0" onclick="saveMeter()">Save Details</button><button class="go s" style="margin:0" onclick="addMeter()">+ Add Meter</button></div><button class="go r" onclick="delMeter()">${CF==="m"?"Tap again to delete":"Delete This Meter"}</button><div id="mm" class="mu" style="margin-top:8px"></div></div><div class="card"><div class="h2">Data Backup</div><div class="mu">Your data is saved online. Download a backup now and then to be safe.</div><div class="g2"><button class="go s" style="margin:0" onclick="backup()">💾 Backup (.json)</button><button class="go s" style="margin:0" onclick="$('rf2').click()">📂 Restore</button></div><input type="file" id="rf2" accept=".json" style="display:none" onchange="restore(this)"><button class="go s" onclick="syncNow()">🔄 Sync now</button><button class="go r" onclick="reset()">${CF==="x"?"Tap again to reset":"Reset to Starting Data"}</button></div><p class="mu" style="text-align:center">By Vashishth Patel</p>`}
function collectSys(){const m=cm(),n=x=>{const v=parseFloat($(x).value);return isNaN(v)?undefined:v};
 document.querySelectorAll(".ivn").forEach(x=>{const q=m.inv.find(y=>y.id===x.dataset.i);if(q)q.name=x.value.trim()||q.name});
 m.cap=n("sc");m.capu=$("su").value;m.pb=$("sp").value.trim();m.pw=n("sw");m.pn=n("sn");m.pd=$("sd").value;m.pi=$("si").value.trim();
 ["cap","pb","pw","pn","pd","pi"].forEach(k=>{if(m[k]===undefined||m[k]==="")delete m[k]})}
function addInv(){if(!ADM)return;const m=cm();collectSys();m.inv.push({id:"i"+Date.now().toString(36),name:"Inverter "+(m.inv.length+1)});save();refresh();rSet()}
function delInv(id){if(!ADM)return;const m=cm();collectSys();if(CF!=="i"+id){CF="i"+id;rSet();return}m.inv=m.inv.filter(x=>x.id!==id);CF=null;save();refresh();rSet()}
function saveSys(){if(!ADM)return;collectSys();save();refresh();go(3)}
function saveBill(){if(!ADM)return;const m=cm();if(!$("bs").value||!$("be").value)return;m.start=$("bs").value;m.end=$("be").value;save();refresh();$("mm")&&0}
function nextBill(){if(!ADM)return;const m=cm(),d=new Date(m.end+"T00:00");m.start=m.end;d.setMonth(d.getMonth()+2);m.end=d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());save();refresh();go(3)}
function saveRates(){if(!ADM)return;const R=S.rates;R.imp=parseFloat($("ri").value)||0;R.exp=parseFloat($("re").value)||0;R.fix=parseFloat($("rf").value)||0;save();refresh();go(3)}
function saveMeter(){if(!ADM)return;const m=cm();m.name=$("mn").value||m.name;m.consumer=$("mc").value||m.consumer;save();refresh();go(3)}
function addMeter(){if(!ADM)return;const id="m"+Date.now().toString(36),d=today(),e=new Date(d+"T00:00");e.setMonth(e.getMonth()+2);S.meters.push({id,inv:[{id:"i1",name:"Inverter 1"}],name:"New Meter",consumer:"",start:d,end:e.getFullYear()+"-"+p2(e.getMonth()+1)+"-"+p2(e.getDate())});S.cur=id;save();refresh();go(3)}
function delMeter(){if(!ADM)return;if(S.meters.length<2){$("mm").textContent="You need at least one meter.";return}if(CF!=="m"){CF="m";rSet();return}S.del=(S.del||[]).concat(S.cur);S.R=S.R.filter(r=>r.m!==S.cur);S.meters=S.meters.filter(m=>m.id!==S.cur);S.cur=S.meters[0].id;CF=null;save();refresh();go(3)}
function reset(){if(!ADM)return;if(CF!=="x"){CF="x";rSet();return}const th=S.theme,del=[...S.R.map(r=>r.id),...S.meters.map(m=>m.id),...(S.del||[])];S=fresh();const nid="m"+Date.now().toString(36);S.meters[0].id=nid;S.cur=nid;S.R.forEach((r,k)=>{r.id="z"+Date.now().toString(36)+k;r.m=nid});S.theme=th;S.del=del;CF=null;save();refresh();go(3)}
async function dl(name,data){try{const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){}}
function exp(kind){const E=enrich(),H=["Date","Time","Import","Export","Δ Import","Δ Export","Net",...invs().map(x=>x.name+" Gen"),"Total Gen","House Use"],rows=cyc(E).map(r=>[dmy(r.d),t12(r.tm),r.i,r.e,r.di??"",r.de??"",r.nt??"",...r.gv.map(v=>v??""),r.g??"",r.house??""]);
if(kind==="xlsx"&&window.XLSX){const ws=XLSX.utils.aoa_to_sheet([H,...rows]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Readings");dl("energy-readings.xlsx",new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})]))}
else dl("energy-readings.csv",new Blob([[H,...rows].map(r=>r.join(",")).join("\n")],{type:"text/csv"}))}
function backup(){dl("energy-tracker-backup.json",new Blob([JSON.stringify(S)],{type:"application/json"}))}
function restore(inp){if(!ADM)return;const fl=inp.files[0];if(!fl)return;fl.text().then(t=>{try{const o=JSON.parse(t);if(o.R&&o.meters){S=o;save();refresh();go(3)}}catch(e){}})}
function rem(){if(!ADM){$("rem").innerHTML="";return}const n=new Date(),hm=p2(n.getHours())+":"+p2(n.getMinutes());let h="";
 [cm()].forEach(m=>{const rt=m.rt===undefined?"19:30":m.rt;if(!rt||hm<rt)return;if(S.R.some(r=>r.m===m.id&&r.t.slice(0,10)===today()))return;
 h+=`<div class="rem row sb"><div><b class="a">🔔 Daily Reading Reminder</b><div class="mu" style="color:var(--tx)">Today's reading (${dmy(today())}) is not added yet for ${esc(m.name)}.</div></div><button class="chip" style="background:#f5a623;color:#2a1a00;border:0" onclick="S.cur='${m.id}';refresh();go(1)">Add Now</button></div>`});$("rem").innerHTML=h}
function saveRem(){if(!ADM)return;document.querySelectorAll(".rtm").forEach(i=>{const m=S.meters.find(x=>x.id===i.dataset.m);if(m)m.rt=i.value});save();refresh();go(3)}
let TH="dark";try{TH=localStorage.getItem("et_theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){}
function theme(){TH=TH==="dark"?"light":"dark";try{localStorage.setItem("et_theme",TH)}catch(e){}applyTheme()}
function applyTheme(){document.documentElement.dataset.theme=TH;document.body.style.background=getComputedStyle(document.documentElement).getPropertyValue("--bg");$("th").textContent=$("th2").textContent=TH==="dark"?"☀️":"🌙"}
let ADM=false,REMOTE=null,PT=null,LASTJ="",FBINIT=false,SNAP=false;
const OWNER=/^paste/i.test(window.OWNER_EMAIL||"")?"":(window.OWNER_EMAIL||"").toLowerCase();
const rinfo=()=>{if(!REMOTE||!REMOTE.R)return"";const L=REMOTE.R.filter(r=>r.m===S.cur).sort((a,b)=>a.t<b.t?-1:1);return L.length?" · online: "+L.length+" readings, last "+dmy(L[L.length-1].t.slice(0,10)):""};
const syncLabel=()=>!window.FB?"⚠️ Online storage is not set up – data saved on this device only":PRIV?"🔒 This data is private – tap View, then log in to see it.":(ADM?"☁️ Admin – saved online":"🔴 Live view")+rinfo();
function setAdm(v){if(!v&&window.FB)window.FB.logout()}
function onAuthUser(u){startWatch();ADM=!!u&&(!OWNER||(u.email||"").toLowerCase()===OWNER);adminUI();rem();if(TAB===1)rLog();if(TAB===3)rSet()}
function adminUI(){const t=ADM?"🔓 Admin":"🔒 View";$("ad").textContent=t;$("ad2").textContent=ADM?"🔓 Admin":"🔒 View-Only";setSync(syncLabel());$("vo").innerHTML=ADM?"":`<div class="rem row sb" style="border-color:#2a6f9b;background:rgba(56,168,245,.1)"><div>👁 <b style="color:#38a8f5">View-Only Mode:</b> <span class="mu" style="color:var(--tx)">Live readings and charts are shown automatically.</span></div><button class="chip" onclick="adminTap()">Login</button></div>`}
function adminTap(){if(ADM){setAdm(false);return}loginDlg()}
function loginDlg(){$("pm").innerHTML=`<div class="pb2"><div class="h2">Login</div><div class="mu">The owner logs in to add or edit readings. Family members log in to view when the data is private.</div><input id="le" type="email" placeholder="Email" autocomplete="username" style="margin-top:10px"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:8px"><div id="pe" class="mu" style="color:var(--bad);min-height:16px;margin-top:6px"></div><div class="g2"><button class="go s" style="margin:0" onclick="pinClose()">Cancel</button><button class="go" style="margin:0" onclick="doLogin()">Login</button></div><button class="chip" style="margin-top:10px;width:100%" onclick="doReset()">Forgot password?</button></div>`;$("pm").style.display="flex"}
function pinClose(){$("pm").style.display="none"}
async function doLogin(){const e=$("le").value.trim(),p=$("lp").value,m=$("pe");if(!window.FB){m.textContent="Online login is not set up yet.";return}if(!e||!p){m.textContent="Enter email and password.";return}
 try{await window.FB.login(e,p);pinClose()}catch(x){const c=(x.code||x.message||"")+"";m.textContent=/too-many/i.test(c)?"Too many tries. Wait a few minutes.":/network/i.test(c)?"No internet connection.":"Wrong email or password."}}
async function doReset(own){const m=$("pe"),e=own?(window.FB&&window.FB.email()):($("le")&&$("le").value.trim());if(!window.FB||!e){if(m)m.textContent="Type your email above first.";return}
 try{await window.FB.reset(e);if(m){m.style.color="var(--ex)";m.textContent="Reset link sent. Check your email."}else setSync("📧 Password reset email sent")}catch(x){if(m)m.textContent="Could not send. Check the email."}}
function pick(v){S.cur=v;EDIT=null;FULL=false;FD=null;CF=null;save();refresh()}
function showHome(){renderHome();$("app").style.display="none";$("home").style.display="block";window.scrollTo(0,0)}
function openApp(){$("home").style.display="none";$("app").style.display="block";go(0)}
function renderHome(){const m=cm(),C=cyc(enrich());$("hm_s").innerHTML=S.meters.map(x=>`<option value="${x.id}"${x.id===S.cur?" selected":""}>${esc(x.name)}${x.consumer?" – "+esc(x.consumer):""}</option>`).join("");
 $("hm_d").textContent=m.name+" · "+dmy(m.start)+" → "+dmy(m.end);
 if(C.length<2){$("hm_v").innerHTML=`<div class="card mu" style="grid-column:1/3;margin:0">Add at least 2 readings in this billing period to see the variation.</div>`;return}
 const a=C[0],b=C[C.length-1],vi=b.i-a.i,ve=b.e-a.e,net=vi-ve,bx=(l,v,c)=>`<div class="tl" style="border:1px solid var(--bd)"><div class="mu">${l}</div><div class="bg" style="color:${c}">${v}</div></div>`;
 $("hm_v").innerHTML=bx("⚡ Variation – Import",f(vi),"var(--im)")+bx("🔌 Variation – Export",f(ve),"var(--ex)")+bx("Net unit",f(net),net<0?"var(--ex)":"var(--bad)")+bx("Description",`<span style="font-size:15px">${net<0?"✅ Excess Generation":net>0?"❌ Excess Use":"Balanced"}</span>`,"var(--tx)")}
function go(i){TAB=i;CF=null;document.querySelectorAll(".tab").forEach((t,k)=>t.classList.toggle("on",k===i));document.querySelectorAll("nav button").forEach((b,k)=>b.classList.toggle("on",k===i));if(i===1)rLog();if(i===3)rSet();window.scrollTo(0,0)}
function refresh(){adminUI();$("ms").innerHTML=S.meters.map(m=>`<option value="${m.id}"${m.id===S.cur?" selected":""}>${esc(m.name)} – ${esc(m.consumer)}</option>`).join("");rem();rDash();rAna();renderHome();if(TAB===1)rLog();if(TAB===3)rSet()}
load();applyTheme();refresh();go(0);if(window.FB!==undefined)initFB();else{window.addEventListener("fbready",initFB);setTimeout(()=>{if(window.FB===undefined){window.FB=null;initFB()}},6000)}showHome();setInterval(rem,60000);
</script></body></html>
